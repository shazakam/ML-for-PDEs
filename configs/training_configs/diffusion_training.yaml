# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
training_data_path: "data/train_data/heat_equation_m64_h0_minmax_N800.pt"
field_keys: ["a"]          # PDE parameter keys present in each .pt file
batch_size: 128
dataset: "heat"

# ---------------------------------------------------------------------------
# UNet architecture
# in_channels = 1 (u_0) + 1 (u_noisy) + len(field_keys)
# ---------------------------------------------------------------------------
in_channels: 3
out_channels: 64           # Base channel width; doubles at each encoder level (64→128→256→512)
kernel_size: 3
final_filters: 1           # Output channels of the final 1x1 conv
encoder_dropout: 0.1       # Light regularization in the two deepest encoder layers
input_size: 64            # Spatial side length (set to 0 for even dimensions)

# ---------------------------------------------------------------------------
# Diffusion / noise schedule
# ---------------------------------------------------------------------------
num_timesteps: 500         # Total diffusion steps T
cosine_shift: 0.008        # Cosine schedule offset s

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
optimiser: adamw           # Decoupled weight decay; better generalization than adam
learning_rate: 0.0001

# ---------------------------------------------------------------------------
# Training (PyTorch Lightning Trainer)
# ---------------------------------------------------------------------------
max_epochs: 200            # Early stopping will cap actual training
accelerator: mps           # cpu | cuda | mps
devices: 1                 # Number of devices to use (e.g. 1 for single GPU, -1 for all)
precision: 16              # 32 | 16-mixed
log_every_n_steps: 50

val_split: 0.1                 # Fraction of dataset held out for validation
early_stopping_patience: 15   # Stop after this many epochs with no val_loss improvement
early_stopping_min_delta: 0.00001 # Minimum change to count as an improvement

# ---------------------------------------------------------------------------
# Weights & Biases
# ---------------------------------------------------------------------------
wandb_project: "ml-for-pdes"
wandb_entity: 'louis-godtfredsen'             # Your WandB username or team name
wandb_run_name: null           # null = auto-generated by WandB

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
model_save_path: "checkpoints/diffusion_heat"
save_every_n_epochs: 10
