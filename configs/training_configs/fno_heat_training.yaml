# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
training_data_path: "data/train_data/heat_equation_m64_h0_minmax_N800.pt"
field_keys: ["a"]          # PDE parameter keys present in each .pt file
batch_size: 128
problem_type: "heat"

# ---------------------------------------------------------------------------
# FNO architecture
# Input channels = 1 (u_t) + len(field_keys) = 2  -> input_dim
# P lifts input_dim -> projection_dim (d_v); Q projects d_v -> output_dim
# num_p_layers / num_q_layers are the FFN layer-size lists (not counts).
# Each *_activations list must have length len(layer_sizes) - 1.
# ---------------------------------------------------------------------------
input_dim: 2

# P projection (lift): single linear 2 -> 32
num_p_layers: [2, 32]
p_activations: ["identity"]

projection_dim: 32          # d_v — channel width inside the Fourier layers

num_fourier_modes: 12       # modes kept per spatial dim (<= H//2 + 1 = 33)
num_fourier_layers: 4

# Q projection: 32 -> 128 -> 1  (GELU in the hidden layer; final layer is linear)
output_dim: 1
num_q_layers: [32, 128, 1]
q_activations: ["gelu", "identity"]

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
optimiser: adamw           # Decoupled weight decay; better generalization than adam
learning_rate: 0.0001

# ---------------------------------------------------------------------------
# Training (PyTorch Lightning Trainer)
# ---------------------------------------------------------------------------
max_epochs: 200            # Early stopping will cap actual training
accelerator: mps           # cpu | cuda | mps
devices: 1                 # Number of devices to use (e.g. 1 for single GPU, -1 for all)
precision: 32              # 32 recommended on MPS — half-precision rfft2/irfft2 is unsupported there
log_every_n_steps: 50

val_split: 0.1                 # Fraction of dataset held out for validation
early_stopping_patience: 15    # Stop after this many epochs with no val_loss improvement
early_stopping_min_delta: 0.00001 # Minimum change to count as an improvement

# ---------------------------------------------------------------------------
# Weights & Biases
# ---------------------------------------------------------------------------
wandb_project: "ml-for-pdes"
wandb_entity: 'louis-godtfredsen'             # Your WandB username or team name
wandb_run_name: 'FNO'           # null = auto-generated by WandB

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
model_save_path: "checkpoints/fno_heat"
save_every_n_epochs: 10
