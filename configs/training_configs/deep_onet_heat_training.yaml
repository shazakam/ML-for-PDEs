# Data
training_data_path: data/train_data/heat_equation_m64_h0_minmax_N800.pt
field_keys: [a]
batch_size: 512
problem_type: heat
# Spatial query points sampled per function each step (dense trunk supervision)
num_query_points: 128

# Branch net — convolutional section
# Input: (2, 64, 64)  [1 solution channel + 1 param channel]
# After 3 blocks with stride 2: (64, 8, 8) -> flattened 4096
conv_branch_layers: [2, 16, 32, 64]
conv_branch_activations: [relu, relu, relu]
stride_branch: 2

# Branch net — FFN section
# First entry must equal flattened conv output (32 * 8 * 8 = 4096)
# Last entry is latent dim p — must match trunk output
ffn_branch_layers: [4096, 256, 64]
ffn_branch_activations: [relu, relu]

# Trunk net — FFN
# First entry must be 3 (normalised x, y, t coordinates)
# Last entry must match ffn_branch_layers last entry
ffn_trunk_layers: [3, 64, 64]
ffn_trunk_activations: [relu, relu]

dropout: 0.1

# Optimiser
optimiser: adamw
learning_rate: 1.0e-3

# Trainer
max_epochs: 300
accelerator: mps
devices: 1
precision: 32
log_every_n_steps: 50

# Checkpointing
model_save_path: checkpoints/deep_onet_heat
save_every_n_epochs: 10

# Early stopping
val_split: 0.1
early_stopping_patience: 40
early_stopping_min_delta: 0.0

# WandB (set to null to disable logging)
wandb_project: "ml-for-pdes"
wandb_entity: 'louis-godtfredsen'             # Your WandB username or team name
wandb_run_name: "deep-onet-heat"           # null = auto-generated by WandB
