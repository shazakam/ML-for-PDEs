[project]
name = "ml-diffusion-for-pdes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.15.1",
    "imageio>=2.37.2",
    "lightning>=2.6.1",
    "lightning-sdk>=2026.4.16",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pyaml>=26.2.1",
    "pytest>=9.0.2",
    "scipy>=1.17.0",
    "torch>=2.10.0",
    "torch-geometric>=2.8.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "wandb>=0.26.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_generators", "utils"]

[tool.pytest.ini_options]
pythonpath = ["."]
